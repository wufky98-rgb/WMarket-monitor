services:
  - type: web
    name: market-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start_server.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: MM_HESLO
        sync: false
      - key: GROQ_API_KEY
        sync: false
